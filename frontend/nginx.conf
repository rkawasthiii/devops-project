# Processed by docker-entrypoint envsubst at container start:
# ${BACKEND_URL} is substituted with the real backend address
# (docker-compose: http://backend:8000, Kubernetes: http://<release>-backend).

server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API + operational endpoints → backend service
    location ~* ^/(api|health|ready|metrics|docs|openapi.json)(/.*)?$ {
        proxy_pass         ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Everything else → React single-page app
    location / {
        try_files $uri $uri/ /index.html;
    }
}
