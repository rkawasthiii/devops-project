{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "medidesk.fullname" . }}-postgres
  labels:
    {{- include "medidesk.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  clusterIP: None   # headless — governs the StatefulSet's network identity
  selector:
    app.kubernetes.io/component: postgres
    {{- include "medidesk.selectorLabels" . | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
{{- end }}
