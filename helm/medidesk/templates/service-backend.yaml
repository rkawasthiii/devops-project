apiVersion: v1
kind: Service
metadata:
  name: {{ include "medidesk.fullname" . }}-backend
  labels:
    {{- include "medidesk.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.backend.service.type }}
  selector:
    app.kubernetes.io/component: backend
    {{- include "medidesk.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
