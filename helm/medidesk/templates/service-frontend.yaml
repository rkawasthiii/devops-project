apiVersion: v1
kind: Service
metadata:
  name: {{ include "medidesk.fullname" . }}-frontend
  labels:
    {{- include "medidesk.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    app.kubernetes.io/component: frontend
    {{- include "medidesk.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
