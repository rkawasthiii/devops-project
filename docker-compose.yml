name: medidesk

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: medidesk
      POSTGRES_PASSWORD: medidesk
      POSTGRES_DB: medidesk
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medidesk -d medidesk"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://medidesk:medidesk@postgres:5432/medidesk
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:8080"
    depends_on:
      - backend

volumes:
  pgdata:
