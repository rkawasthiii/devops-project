# Values for the grafana/grafana Helm chart:
#   helm repo add grafana https://grafana.github.io/helm-charts
#   helm install grafana grafana/grafana \
#     -n monitoring -f monitoring/grafana-values.yaml

adminUser: admin
adminPassword: medidesk123   # demo credentials for the classroom cluster

persistence:
  enabled: false

service:
  type: ClusterIP
  port: 80

# Pre-wire the Prometheus datasource so the dashboard works immediately.
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus-server.monitoring.svc.cluster.local
        access: proxy
        isDefault: true

# Dashboard sidecar: picks up any ConfigMap labelled grafana_dashboard=1 —
# monitoring/dashboard-configmap.yaml ships the MediDesk API dashboard.
sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"
    searchNamespace: ALL
    provider:
      name: default
      folder: "MediDesk"
